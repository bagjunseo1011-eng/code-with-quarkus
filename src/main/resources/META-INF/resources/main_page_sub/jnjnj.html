<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 결과 - League of Legends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0e17; color: #fff; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
        .accent-purple { color: #a020f0; }
        .search-category-item { padding: 10px 15px; cursor: pointer; color: #555; transition: all 0.2s; border-radius: 5px; }
        .search-category-item:hover { background-color: #f8f9fa; }
        .search-category-item.active { font-weight: bold; color: #a020f0; background-color: #f3e8fc; }
        .search-result-card { transition: transform 0.2s ease; border: 1px solid #eee; }
        .search-result-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand accent-purple fw-bold" href="index.html">League of Legends</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">홈으로</a></li>
                </ul>
                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" id="searchInput" placeholder="Search" />
                    <button class="btn btn-outline-success" type="submit">검색</button>
                </form>
            </div>
        </div>
    </nav>

    <section id="searchResults" style="display:none;" class="container mt-5 mb-5 text-dark">
        <div class="search-keyword-header text-white mb-4">
            <h2 class="fw-bold">검색 결과: <span id="searchKeywordDisplay" class="accent-purple"></span></h2>
        </div>
        
        <div class="search-body">
            <div class="row g-4">
                <div class="col-md-3 col-lg-2">
                    <div class="search-sidebar bg-white py-3 rounded shadow-sm">
                        <div class="px-3 mb-2" style="font-size:0.8rem; color:#999;">카테고리</div>
                        <div class="search-category-item active mx-2" onclick="switchCategory('champion', this)">
                            챔피언 <span class="count" id="champCount">(0)</span>
                        </div>
                        <div class="search-category-item mx-2 mt-1" onclick="switchCategory('news', this)">
                            뉴스 <span class="count" id="newsCount">(0)</span>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-9 col-lg-10 search-content-area text-white">
                    <div id="resultChampion">
                        <h5 class="mb-4">챔피언</h5>
                        <div id="championResultList" class="text-dark"></div>
                    </div>
                    <div id="resultNews" style="display:none;">
                        <h5 class="mb-4">뉴스</h5>
                        <div id="newsResultList" class="text-dark"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="search.js"></script>
</body>
</html>
