



<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0a0e17;
            color: #fff;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        .accent-purple {
            color: #a020f0;
        }

        .bg-custom-dark {
            background-color: #121825 !important;
        }

        .btn-primary {
            background-color: #a020f0;
            border: none;
        }

        .btn-primary:hover {
            background-color: #8a1bc2;
        }

        .login-box {
            max-width: 400px;
            background-color: #121825;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #2a3241;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand accent-purple fw-bold" href="/">League of Legends</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">로그인</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


</body>
<section class="hero d-flex align-items-center justify-content-center text-center py-5">
  <div class="container" style="max-width: 480px;">
    <h2 class="fw-bold mb-4">회원가입</h2>
    <form id="registerForm" action="/register_check" method="post">
      <!-- 아이디 -->
      <div class="mb-3 text-start">
        <label class="form-label">아이디 *</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="4~20자 영문/숫자" required>
        <div class="invalid-feedback" id="usernameMsg"></div>
      </div>

      <!-- 패스워드 -->
      <div class="mb-3 text-start">
        <label class="form-label">패스워드 *</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="8자 이상, 영문+숫자+특수문자" required>
      </div>

      <!-- 패스워드 확인 -->
      <div class="mb-3 text-start">
        <label class="form-label">패스워드 확인 *</label>
        <input type="password" class="form-control" id="passwordConfirm" placeholder="패스워드 재입력" required>
        <div class="invalid-feedback" id="passwordMsg"></div>
      </div>

      <!-- 이메일 -->
      <div class="mb-3 text-start">
        <label class="form-label">이메일 *</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
        <div class="invalid-feedback" id="emailMsg"></div>
      </div>

      <!-- 연락처 -->
      <div class="mb-3 text-start">
        <label class="form-label">연락처 *</label>
        <input type="text" class="form-control" id="phone" name="phone" placeholder="010-0000-0000" required>
        <div class="invalid-feedback" id="phoneMsg"></div>
      </div>

      <input type="hidden" id="hashedPassword" name="password">
      <button type="button" class="btn btn-primary w-100" onclick="validateAndShowModal()">회원가입</button>
    </form>
  </div>
  <!-- 가입 확인 모달 -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">가입 확인</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>아래 정보로 가입하시겠습니까?</p>
          <table class="table table-dark table-bordered">
            <tr>
              <th>아이디</th>
              <td id="confirmUsername"></td>
            </tr>
            <tr>
              <th>이메일</th>
              <td id="confirmEmail"></td>
            </tr>
          </table>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" onclick="submitRegisterForm()">확인</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../JS/input_check.js"></script>
  <script src="../JS/input_sha256.js"></script>
  <script>
    function submitRegisterForm() {
      document.getElementById('registerForm').submit();
    }
  </script>
</section>
</body>
</html>
