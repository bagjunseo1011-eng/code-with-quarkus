<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0a0e17;
            color: #fff;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        .accent-purple {
            color: #a020f0;
        }

        .bg-custom-dark {
            background-color: #121825 !important;
        }

        .btn-primary {
            background-color: #a020f0;
            border: none;
        }

        .btn-primary:hover {
            background-color: #8a1bc2;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background-color: #121825;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #2a3241;
        }

        .btn-outline-secondary {
            color: #aaa;
            border-color: #444;
        }

        .btn-outline-secondary:hover {
            background-color: #2a3241;
            color: white;
            border-color: #666;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand accent-purple fw-bold" href="/">League of Legends</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">홈</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">로그인</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="d-flex align-items-center justify-content-center text-center" style="min-height: 85vh;">
        <div class="login-box">
            <h2 class="fw-bold mb-4">로그인</h2>

            <form id="loginForm" method="POST" action="/login_check">
                <div class="mb-3 text-start">
                    <label class="form-label">아이디</label>
                    <input type="text"
                           class="form-control"
                           id="loginUsername"
                           name="username"
                           placeholder="아이디 입력"
                           required>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">패스워드</label>
                    <input type="password"
                           class="form-control"
                           id="loginPassword"
                           placeholder="패스워드 입력"
                           required>
                </div>

                <!-- 서버로 전송되는 비밀번호 -->
                <input type="hidden" id="loginHashedPassword" name="password">

                <button type="button" onclick="validateAndLogin()" class="btn btn-primary w-100">
                    로그인
                </button>

                <hr>

                <a href="/register" class="btn btn-outline-secondary w-100">
                    회원가입
                </a>
            </form>
        </div>
    </section>

    <script>
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));

            return hashArray
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        async function validateAndLogin() {
            const username = document.getElementById("loginUsername");
            const password = document.getElementById("loginPassword");
            const hashedPassword = document.getElementById("loginHashedPassword");

            if (!username.value.trim()) {
                alert("아이디를 입력해주세요.");
                username.focus();
                return;
            }

            if (!password.value.trim()) {
                alert("비밀번호를 입력해주세요.");
                password.focus();
                return;
            }

            const hashed = await hashPassword(password.value);
            hashedPassword.value = hashed;

            console.log("Login hashed password:", hashed);

            document.getElementById("loginForm").submit();
        }
    </script>
</body>
</html>
