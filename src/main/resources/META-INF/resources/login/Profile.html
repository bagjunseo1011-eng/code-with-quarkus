<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 로그인 후 메인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0e17;
            color: #fff;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        .accent-purple { color: #a020f0; }
        .bg-custom-dark { background-color: #121825 !important; }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #2a3241;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(160, 32, 240, 0.2);
        }

        .btn-primary { background-color: #a020f0; border: none; }
        .btn-primary:hover { background-color: #8a1bc2; }

        .hero-section { padding: 4rem 0 2rem 0; }

        .login-success-box {
            background-color: #121825;
            border: 1px solid #2a3241;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #fff; }

        body.light-theme { background-color: #f0f2f5; color: #1a1a2e; }
        body.light-theme .navbar { background-color: #6c757d !important; }
        body.light-theme .card { background-color: #ffffff; border-color: #dee2e6; color: #1a1a2e; }

        body.light-theme .bg-custom-dark,
        body.light-theme .hero-section,
        body.light-theme .login-success-box { background-color: #ffffff !important; color: #1a1a2e; }

        body.light-theme .text-secondary { color: #6c757d !important; }
        body.light-theme .theme-toggle-btn { border-color: rgba(0, 0, 0, 0.3); color: #1a1a2e; }
        body.light-theme .btn-outline-light { color: #1a1a2e; border-color: #6c757d; }
        body.light-theme .btn-outline-light:hover { background-color: #e9ecef; }
    </style>
</head>

<body>
    <!-- 네비바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand accent-purple fw-bold" href="/">League of Legends</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/">리그옵</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">뉴스</a></li>
                    <li class="nav-item"><a class="nav-link" href="/champions">챔피언</a></li>
                    <li class="nav-item"><a class="nav-link" href="/main_page_sub/download.html">다운로드</a></li>
                    <li class="nav-item"><a class="nav-link" href="/profile">프로필</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-outline-danger btn-sm px-3" href="/logout">로그아웃</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">외부 웹사이트</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">공식 사이트</a></li>
                            <li><a class="dropdown-item" href="#">롤 전적 검색</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">관련 유튜브</a></li>
                        </ul>
                    </li>
                </ul>

                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Search" id="searchInput">
                    <button class="btn btn-outline-success" type="submit">검색</button>
                </form>

                <button class="btn theme-toggle-btn ms-2" id="themeToggleBtn" onclick="toggleTheme()">DARK</button>
            </div>
        </div>
    </nav>

    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 500px;">
            <h2 class="fw-bold mb-4">내 프로필</h2>

            <!-- 프로필 사진 영역 -->
            <div class="mb-4">
                <img id="profileImg" src="/uploads/profile/default.png" class="rounded-circle" width="120" height="120" style="object-fit:cover; border:3px solid #fff;" alt="프로필 사진">
            </div>

            <!-- 개인 정보 출력 -->
            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body text-start">
                    <table class="table table-dark table-bordered mb-0">
                        <tr>
                            <th style="width:30%">아이디</th>
                            <td id="infoUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="infoEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="infoPhone"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 사진 업로드 폼 -->
            <form id="uploadForm" method="POST" action="/profile/upload" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">프로필 사진 변경</label>
                    <input type="file" class="form-control" id="profileFile" name="profileImage" accept="image/jpeg,image/png,image/gif,image/webp">
                    <div class="form-text text-muted">jpg, png, gif, webp / 최대 5MB</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">사진 업로드</button>
            </form>
        </div>
    </section>

    <!-- JS 연동 -->
    <script src="/JS/search.js"></script>
    <script src="/JS/toggle.js"></script>
    <script src="/JS/Profile.js"></script>
    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
